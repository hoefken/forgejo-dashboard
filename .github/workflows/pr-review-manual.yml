name: PR Review (Manual)

# Manually triggered by a maintainer after reviewing fork/external PR code.
# workflow_dispatch runs with repo secrets and full permissions, making it
# safe for fork PRs that the automatic pr-preview workflow skips.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number
      source:
        description: "PR source (for reference only)"
        required: false
        default: "fork"
        type: choice
        options:
          - fork
          - same-repo
          - external

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  review:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pr/${{ inputs.pr_number }}/
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ inputs.pr_number }}
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('base_branch', pr.base.ref);
            core.setOutput('title', pr.title);
            console.log(`PR #${{ inputs.pr_number }}: "${pr.title}"`);
            console.log(`Source: ${pr.head.repo.full_name} @ ${pr.head.sha}`);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          PR_NUMBER=${{ inputs.pr_number }}
          PREVIEW_DIR="pr/${PR_NUMBER}"

          mkdir -p _site

          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git show origin/gh-pages:index.html > _site/index.html 2>/dev/null || cp forgejo-local.html _site/index.html
            git archive origin/gh-pages -- pr/ 2>/dev/null | tar -x -C _site/ 2>/dev/null || true
          else
            cp forgejo-local.html _site/index.html
          fi

          touch _site/.nojekyll
          mkdir -p "_site/${PREVIEW_DIR}"
          cp forgejo-local.html "_site/${PREVIEW_DIR}/index.html"

      - name: Update gh-pages branch state
        run: |
          PR_NUMBER=${{ inputs.pr_number }}
          PREVIEW_DIR="pr/${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp forgejo-local.html /tmp/index.html

          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          touch .nojekyll
          mkdir -p "${PREVIEW_DIR}"
          cp /tmp/index.html "${PREVIEW_DIR}/index.html"

          git add .nojekyll "${PREVIEW_DIR}/index.html"
          git commit -m "Deploy PR #${PR_NUMBER} preview (manual, source: ${{ inputs.source }})" --allow-empty
          git push origin gh-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previewUrl = `https://${owner}.github.io/${repo}/pr/${prNumber}/`;
            const triggeredBy = context.actor;
            const source = '${{ inputs.source }}';
            const body = `**Preview deployed!** *(manually triggered by @${triggeredBy} — source: ${source})*\n\n${previewUrl}`;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const botComment = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('Preview deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: botComment.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body
              });
            }
